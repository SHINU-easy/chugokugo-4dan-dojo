     u=単元（例 5-6 / 1,3,5 / all）  tab=learn,compose,listen,vocab,stats  view=a4,card  size=s,m,l,xl

<style>

/* Layout: 練習帳(田字格)をモチーフにした学習ツール。上部に出題範囲、下に6つのモード。 */
:root{
  --bg:#EFF2F6; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#172033; --ink2:#586579; --line:#D3DAE4;
  --accent:#1D4E89; --accent-ink:#FFFFFF; --accent-soft:#E3ECF7;
  --ok:#17704A; --ok-soft:#DDF3E8; --ng:#B42318; --ng-soft:#FBE4E1; --mark:#FFE27A; --grid:#C9D3E2;
  --t1:#D1342F; --t2:#2B8A4B; --t3:#2563C9; --t4:#8A3FC4; --t5:#6B7686;
  --f-ja:"BIZ UDPMincho","BIZ UDP明朝 Medium","UD Digi Kyokasho NP-R","Yu Mincho","Hiragino Mincho ProN","MS PMincho","Noto Serif JP",serif;
  --f-ui:var(--f-ja);
  --f-zh:"KaiTi","KaiTi_GB2312","楷体","楷体_GB2312","Kaiti SC","STKaiti","AR PL UKai CN","Noto Serif SC",serif;
  --f-py:"SimSun","NSimSun","宋体","Songti SC","STSong","Noto Serif SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --surface2:#1C2431; --ink:#E7ECF4; --ink2:#9AA7BB; --line:#2A3445;
  --accent:#8DB8F0; --accent-ink:#0E131B; --accent-soft:#1E2C42;
  --ok:#5FD39A; --ok-soft:#14352A; --ng:#FF8A7E; --ng-soft:#3A1D1A; --mark:#6B5A12; --grid:#33405A;
  --t1:#FF7B73; --t2:#62CF86; --t3:#78A8FF; --t4:#C792F2; --t5:#93A0B3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface2:#1C2431; --ink:#E7ECF4; --ink2:#9AA7BB; --line:#2A3445;
  --accent:#8DB8F0; --accent-ink:#0E131B; --accent-soft:#1E2C42;
  --ok:#5FD39A; --ok-soft:#14352A; --ng:#FF8A7E; --ng-soft:#3A1D1A; --mark:#6B5A12; --grid:#33405A;
  --t1:#FF7B73; --t2:#62CF86; --t3:#78A8FF; --t4:#C792F2; --t5:#93A0B3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.02em}
h2{font-size:1.15rem;margin:0 0 4px}
h3{font-size:.95rem;margin:18px 0 8px;color:var(--ink2);letter-spacing:.06em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.apphd{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
.apphd h1{flex:none;white-space:nowrap}
.apphd .tabs{flex:1 1 auto;border-bottom:0;margin:0;padding:0;min-width:0}
.apphd .tab{margin-bottom:0;padding:6px 12px}
.apphd small{margin-left:auto;white-space:nowrap}
.apphd small{color:var(--ink2)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;border-bottom:2px solid var(--line)}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--ink2);font-weight:500;border-radius:8px 8px 0 0}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
@media (max-width:480px){
  .apphd .tabs{gap:2px}
  .apphd .tab{padding:6px 8px;font-size:.9em}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.scope summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.scope summary span{font-weight:400;color:var(--ink2)}
.scope summary i{font-style:normal;color:var(--accent);margin-left:6px;display:inline-block;transition:transform .15s}.scope[open] summary i{transform:rotate(180deg)}
#view.zs{zoom:var(--cz,1)}
.szrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.szrow b{font-size:.85rem}
.lnk{width:100%;font-size:.8rem;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chips .grph{flex:0 0 100%;font-size:12px;margin-top:6px;opacity:.75}
.pill .lvb{font-size:.68rem;color:var(--ink2);font-weight:400;margin-left:2px}.pill[aria-pressed="true"] .lvb{color:inherit;opacity:.85}
.lvrow{gap:6px;align-items:center;margin:4px 0}.lvrow .pill.sm{padding:2px 10px;font-size:.8rem}
.lvlg{font-size:.78rem;margin:2px 0 8px;line-height:1.5}.lvd{margin:-4px 0 8px;line-height:1.5}
.chip,.pill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 12px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.pill{cursor:pointer}
.pill[aria-pressed="true"],.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:.85rem;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.set{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--ink2);margin-top:8px}
.set label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.set select{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
ul.notes{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.card .lab{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.card .ja{font-size:.85rem;color:var(--ink2);border-top:1px dotted var(--line);padding-top:6px}
.card .say{position:absolute;top:6px;right:6px}
.say{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:1px 8px}
.rb{display:inline-flex;flex-wrap:wrap;gap:2px .55em;font-family:var(--f-zh);line-height:1.2}
.tk{display:inline-flex;flex-direction:column;align-items:center}
.tk .py{font-family:var(--f-py);font-size:.72em;color:var(--ink2);min-height:1.2em;white-space:nowrap}
.tk .hz{font-size:1.15rem;font-weight:700;white-space:nowrap;position:relative}
.tk .hz .pu{position:absolute;left:100%;top:0}.tk.lst{margin-right:1.15rem}
.no-py .tk .py{display:none}
.py i{font-style:normal;font-weight:600}
.tone .py i.t1{color:var(--t1)}.tone .py i.t2{color:var(--t2)}.tone .py i.t3{color:var(--t3)}.tone .py i.t4{color:var(--t4)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.item .n{font-size:.75rem;color:var(--ink2);min-width:1.8em}
.item .ja{font-size:.85rem;color:var(--ink2);margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
.tw{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:.78rem;color:var(--ink2);letter-spacing:.06em;font-weight:500}
td.zh{font-family:var(--f-zh);font-weight:700;font-size:1.05rem;white-space:nowrap}
td.py{font-family:var(--f-py);white-space:nowrap}
.pit{font-size:.82rem;background:var(--mark);color:var(--ink);padding:1px 6px;border-radius:4px;display:inline-block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pit{color:#FFF3C0}}
:root[data-theme="dark"] .pit{color:#FFF3C0}
.opts{display:grid;gap:8px;margin:8px 0}
.opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.q{display:flex;flex-direction:column;gap:12px}
.q .prompt{font-size:1.15rem;font-weight:700}
.q .sub{color:var(--ink2);font-size:.88rem}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 8px;margin-right:6px}
.ansbox,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:74px;padding:10px;border-radius:10px}
.ansbox{border:2px dashed var(--line);background:var(--surface2)}
.tile{border:1.5px solid var(--accent);border-radius:6px;background:
  linear-gradient(to right,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px)),var(--surface);
  padding:4px 10px;display:inline-flex;flex-direction:column;align-items:center;min-width:46px;font-family:var(--f-zh)}
.tile .hz{font-size:1.4rem;font-weight:700;line-height:1.3}
.tile .py{font-family:var(--f-py);font-size:.72rem;color:var(--ink2)}
.tile .gl{font-family:var(--f-ui);font-size:.66rem;color:var(--ink2);border-top:1px solid var(--line);margin-top:2px;padding-top:1px}
.tile.used{opacity:.25;pointer-events:none}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.ng{background:var(--ng-soft);border:1px solid var(--ng)}
.fb b.h{font-size:1.05rem}
.fb.ok b.h{color:var(--ok)}.fb.ng b.h{color:var(--ng)}
.choice{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice .zhbig{font-family:var(--f-zh);font-size:1.3rem;font-weight:700}
input[type=text],textarea{width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:.78rem}
.big{font-size:2rem;font-weight:700;line-height:1.1}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat .panel{padding:10px 14px}
.stat small{color:var(--ink2);display:block}
.cbar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 70px;gap:10px;align-items:center;font-size:.85rem;margin:4px 0}
@media (max-width:520px){.cbar{grid-template-columns:1fr 70px}.cbar .bar{grid-column:1/-1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.88rem;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.98);opacity:.4}}}

.zh{font-family:var(--f-zh)}.py{font-family:var(--f-py)}.ja{font-family:var(--f-ja)}
/* ---- A4 pages (from print file, scoped) ---- */

#doc .page{position:relative;width:1123px;height:794px;margin:0 auto 14px;background:#fff;overflow:hidden;box-shadow:0 1px 6px #0003;padding:24px 0 0}
#doc .page .pn{position:absolute;left:84px;top:40px;font-family:var(--f-py);font-size:15px}
#doc .copy{position:absolute;right:16px;bottom:5px;font-size:9px;line-height:1;font-family:var(--f-py);color:#666}
#doc .page.hide{display:none}
#doc h1{margin:0 0 4px;font-size:23px;font-weight:normal;text-align:center;letter-spacing:.5px;padding-left:20px;line-height:1.4}
#doc .h2{margin:2px 0 1px 114px;font-size:15px;line-height:1.3}
#doc .h2 small{font-size:10px;margin-left:6px}
/* grammar */
#doc .box{margin:0 36px 0 70px;border:2.5px solid #000}
#doc .hd,#doc .rw{display:grid;grid-template-columns:var(--gc,417fr 431fr 429fr 467fr)}
#doc .hd>div{font-size:15px;text-align:left;padding-left:8px;line-height:24px;border-right:2px solid #000;border-bottom:1.5px solid #000;letter-spacing:.04em;white-space:nowrap}
#doc .hd>div small{font-size:10.5px;margin-left:10px;letter-spacing:0}
#doc .hd>div:last-child,#doc .rw>.c:last-child{border-right:none}
#doc .c{position:relative;border-right:2px solid #000;border-bottom:3px double #000;padding-left:2px;min-width:0}
#doc .rw:last-child>.c{border-bottom:none}
#doc .c .n{position:absolute;left:2px;top:1px;font-size:8.5px;font-style:normal;font-family:var(--f-ja),"Segoe UI Symbol";line-height:10px;z-index:2}
#doc .gr{display:grid;grid-template-columns:var(--cols);text-align:center;white-space:nowrap}

#doc .gr .r{text-align:right;padding-right:2px}
#doc .af{display:flex;justify-content:center;gap:4px}.af b{flex:none;font-weight:normal;display:inline-block}

/* vocab pages */
#doc .vt{margin:0 0 3px 114px;font-size:21px;font-weight:normal;line-height:1.3}
#doc .wg{display:grid;margin:0 54px 0 70px;row-gap:9px}
#doc .w{position:relative;text-align:center;padding:0 6px;min-width:0}
#doc .wz{font-size:17px;line-height:22px;white-space:nowrap}

"kind":"v","hsk":{"it":[],"w":"語「准备」は語彙表 2級","lv":"2","wonly":1},"ck":{"lv":"準4","it":"助動詞の基本","n":"「准备」は中検語彙表で準4級"}},{"id":"yinggai","name":"应该（当然・義務）","notes":["「应该＋動詞」＝〜すべきだ（当然・義務）","否定「不应该」は「〜すべきではない」","反復疑問は「应该不应该」。短く「应不应该」とも言う","「努力」「每天」など、動作のしかた・頻度を表す語は「应该」のあと・動詞の前に置く（应该每天运动）"],"kind":"v","hsk":{"it":[[152,"3","能愿动词：需要、该、应该、愿意、得"]],"lv":"3"},"ck":{"lv":"準4","it":"助動詞の基本","n":"「应该」は中検語彙表で準4級"}},{"id":"dasuan","name":"打算（つもり）","notes":["「打算＋動詞」＝〜するつもりだ（意図・心づもり）","時間語（晚上・夏天・周末・明年）は主語のあと・動詞の前に置く。日本語の「夜、〜」と同じ感覚でOK","否定は「不打算」、反復疑問は「打算不打算」（短く「打不打算」とも言う）","「打算」は名詞として「つもり・考え」の意味でも使う"],"kind":"v","hsk":{"it":[],"w":"語「打算」は語彙表 3級","lv":"3","wonly":1},"ck":{"lv":"準4","it":"助動詞の基本","n":"「打算」は中検語彙表で準4級"}},{"id":"guo","name":"过（経験）","notes":["「動詞＋过」＝〜したことがある。過去に経験したことを表す（いつかは問わない）。過去の完了を表す「了」とは別物","否定は「没(有)＋動詞＋过」。「不」は使わない（✕不见过）","「过」は動詞の直後、目的語は後ろ","反復疑問は文末に「没有」を付ける（见过…没有）"],"kind":"asp","hsk":{"it":[[101,"2","动态助词：过"],[144,"2","经历态：用动态助词“过”表示"]],"lv":"2"},"ck":{"lv":"準4","it":"“了”“过”の初歩","n":"4級「アスペクトの整理」でも扱う"}},{"id":"zhe","name":"着（状態の持続）","notes":["「動詞＋着」＝〜している（動作の結果が続いている状態）。拿着（手に持っている）、挂着（掛かっている）など。動作の進行（〜している最中）ではなく「状態」","否定は「没(有)＋動詞＋着」（✕不拿着）。反復疑問は文末に「没有」","「场所＋動詞＋着＋物」（墙上挂着地图）は存在を表す。日本語の「〜てある・〜ている」に近い"],"kind":"asp","hsk":{"it":[[102,"2","动态助词：着"],[142,"2","持续态：动词+着：表示状态的持续"]],"lv":"2"},"ck":{"lv":"4","it":"アスペクトの整理","n":"着（持続）"}},{"id":"le_chg","name":"了（状態の変化）","notes":["「主語＋形容詞＋了」＝〜くなった・〜になった（状態の変化）。文末の「了」で、新しい状態になったことを表す","否定は「还＋不＋形容詞」＝まだ〜ない。否定文には「了」を付けない（✕还不饿了）","“吗”疑問は「…了吗」、反復疑問は文末に「没有」（饿了没有）","「了」がないと今の性質・状態（天气很冷＝寒い）、「了」があると変化（天气冷了＝寒くなった）"],"kind":"chg","hsk":{"it":[[26,"1","语气助词：吧1、了2 、吗、呢1、呢2、呢3"],[63,"1","变化态：用语气助词“了2”表示"]],"lv":"1"},"ck":{"lv":"4","it":"","n":"上野の判断で4級"}},{"id":"le_real","name":"了（動作の実現）","notes":["「主語＋動詞＋目的語＋了」＝〜した（動作が実際に行われたこと）。数量のない目的語のときは「了」を文末に置く","否定は「没(有)＋動詞」で「了」は消える（✕没有吃早饭了）。「まだ〜していない」は「还没(有)」","反復疑問は文末に「没有」（吃早饭了没有）。「已经…了」＝もう〜した","数量があるときは「動詞＋了＋数量＋目的語」になる（次の課「動作の完了」）"],"kind":"real","hsk":{"it":[[26,"1","语气助词：吧1、了2 、吗、呢1、呢2、呢3"]],"lv":"1"},"ck":{"lv":"4","it":"","n":"上野の判断で4級"}},{"id":"le","name":"了（動作の完了）","notes":["「動詞＋了＋数量＋目的語」＝〜した（数量つきの完了）。数量のない文は文末に「了」を置く（前の課「動作の実現」）","否定は「没(有)＋動詞」で「了」と数量は消える（✕没有坐了）。「まだ〜していない」は「还没(有)」","反復疑問は文末に「没有」。「过（経験）」「着（持続）」「了（完了）」を区別する","数量表現：一个小时（1時間）、两件毛衣（2着）、六条裤子（6本）。「二」ではなく「两」を量詞の前に使う"],"kind":"le","hsk":{"it":[[25,"1","动态助词：了1"],[62,"1","完成态：用动态助词“了1”表示"]],"lv":"1"},"ck":{"lv":"準4","it":"“了”“过”の初歩","n":"4級「アスペクトの整理」でも扱う"}},{"id":"zai_p","name":"在（場所＋動詞）","notes":["「主語＋在＋場所＋動詞（＋目的語）」＝〜で…する。場所は動詞の前に置く（✕看书在图书馆）","否定は「不在」（bú zài）を場所の前に置く。過去の否定は「没(有)在」","反復疑問は「在不在」。動詞の「在」（〜にいる・ある）と形は同じなので、後ろに動詞があるかで見分ける","日本語の「〜で」に当たる。「家で」＝在家、「図書館で」＝在图书馆"],"kind":"zaiv","hsk":{"it":[[21,"1","引出时间、处所：在"]],"lv":"1"},"ck":{"lv":"準4","it":"介詞の基本","n":""}},{"id":"gen","name":"和／跟（一緒に）","notes":["「主語＋跟（和）＋人＋一起＋動詞」＝〜と一緒に…する。「一起」は動詞の前","否定は「不跟（不和）」を相手の前に置く（✕跟他不一起去）","反復疑問は「跟不跟」。「和」は反復疑問にしにくいので「跟」を使う","「跟」は話し言葉、「和」は書き言葉でも使う。日本語の「〜と」に当たる"],"kind":"gen","hsk":{"it":[[22,"1","引出对象：和1、对"],[96,"2","引出对象：跟1"]],"lv":"1〜2"},"ck":{"lv":"準4","it":"","n":"「和」「跟」「一起」は中検語彙表で準4級"}},{"id":"gei_p","name":"给（〜に…する）","notes":["「主語＋给＋人＋動詞（＋目的語）」＝（人）に…する・（人）のために…する","否定は「不给」を人の前に置く（✕给他不打电话）。反復疑問は「给不给」","「给我打电话」＝私に電話する。「给」を使わないと言えない動詞（打电话・写信・做饭など）に注意","動詞の「给」（あげる：给他一本书）は二重目的語の課。ここでは後ろに別の動詞が来る"],"kind":"geip","hsk":{"it":[[94,"2","引出对象：给"]],"lv":"2"},"ck":{"lv":"準4","it":"","n":"「给」は中検語彙表で準4級"}},{"id":"de_deg","name":"得（程度補語）","notes":["「動詞＋得＋形容詞」＝〜するのが…だ（動作の程度・様子）。目的語がある文では、目的語を動詞の前に出す（汉语说得很好）","肯定は「很＋形容詞」。否定は「很」を外して「不＋形容詞」（说得不好）。“吗”疑問・反復疑問では「很」を付けない","反復疑問は「形容詞＋不＋形容詞」（好不好）。動詞は繰り返さない","「得」は軽声 de。動詞の「得 dé(得る)」・助動詞の「得 děi(〜しなければならない)」とは別の語。可能補語（听得懂）の「得」と形は同じだが意味が違う"],"kind":"deg","hsk":{"it":[[122,"2","状态补语1：动词+得+形容词性短语"]],"lv":"2"},"ck":{"lv":"4","it":"様態補語","n":"得＋形容詞"}},{"id":"jieguo","name":"結果補語（完・懂・到・见…）","notes":["「動詞＋結果補語」＝動作の結果を表す。完（し終える）・懂（分かる）・到（達成）・见（知覚）・错（間違い）・好（きちんと完了）など。動詞と補語の間には何も入れない","肯定は文末に「了」（我写完作业了）。否定は「没(有)＋動詞＋補語」で、「了」は消える（✕不写完）","反復疑問は文末に「了没有」（写完作业了没有）。“吗”疑問は「了吗」。目的語は補語の後ろに置く","看(見る)と看见(見える・見かける)、听(聞く)と听见(聞こえる)の違いに注意。「见」は知覚が成立したことを表す補語"],"kind":"res","hsk":{"it":[[118,"2","结果补语1：动词+错/懂/好/会/完"],[205,"3","结果补语2：动词+到/住/走/上"]],"lv":"2〜3"},"ck":{"lv":"4","it":"結果補語","n":"表の代表例は 完・好・到・见・走"}},{"id":"fangxiang","name":"方向補語（単純）","notes":["「動詞＋方向補語(1字)」＝動作がどちらへ向かうか。来（こちらへ）・去（あちらへ）・进（中へ）・出（外へ）・回（元へ）・上・下・过 など","肯定は文末に「了」。否定は「没(有)＋動詞＋方向補語」で「了」は消える","“吗”疑問は「…了吗」、反復疑問は文末に「没有」","補語の「来・去」は軽く発音する（回来 huílai／出去 chūqu）。进・出などの後ろに場所を置ける（走进教室）"],"kind":"dir","hsk":{"it":[[119,"2","趋向补语1：简单趋向补语的趋向意义用法：动词+来/去"],[120,"2","趋向补语1：简单趋向补语的趋向意义用法：动词+上/下/进/出/过/回"]],"lv":"2"},"ck":{"lv":"3","it":"方向補語（単純）","n":""}},{"id":"fangxiang2","name":"方向補語（複合）","notes":["「動詞＋进/出/上/下/回/过/起＋来/去」＝動作の方向を2段で表す（跑出去＝走って外へ・向こうへ出て行く）","肯定は文末に「了」。否定は「没(有)＋動詞＋方向補語」で「了」は消える","“吗”疑問は「…了吗」、反復疑問は文末に「没有」","「来・去」は軽く発音する（站起来 zhàn qǐlai）。場所は「来・去」の前に入る（走进教室来）"],"kind":"dir","hsk":{"it":[[121,"2","趋向补语1：复合趋向补语的趋向意义用法：动词+出来/出去/过来/过去/回来/回去/进来/进去/起来/上来/上去/下来/下去"]],"lv":"2"},"ck":{"lv":"3","it":"方向補語（複合）","n":""}},{"id":"fangxiang3","name":"方向補語（派生用法）","notes":["方向補語が「方向」以外の意味を表す用法：想出（考え出す）・想起来（思い出す）・爱上（好きになる）","起来＝〜し始める（哭起来・热起来）／下来＝動きが止まる（停下来）／下去＝〜し続ける（坚持下去）","肯定は文末に「了」。否定は「还没(有)＋動詞＋補語」（まだ〜していない）で「了」は消える。反復疑問は文末に「没有」","目的語は想出・爱上なら補語の後ろ（想出办法）。起来の文では「来」の前に入る（下起雨来）"],"kind":"dir","hsk":{"it":[[206,"3","趋向补语2：趋向补语的引申用法：表示结果意义：动词+出/起/下"],[207,"3","趋向补语2：趋向补语的引申用法：表示动作行为的开始：动词+上/起来"],[208,"3","趋向补语2：趋向补语的引申用法：表示动作行为的持续：动词+下去/下来"]],"lv":"3"},"ck":{"lv":"3","it":"方向補語（複合）","n":"派生義（〜し始める・〜し続けるなど）"}},{"id":"keneng2","name":"可能補語（得／不＋補語）","notes":["「動詞＋得＋補語」＝〜できる。否定は「動詞＋不＋補語」＝〜できない。結果補語（懂・见・完・到）の間に「得／不」を入れた形（听懂→听得懂／听不懂）","可能補語は「結果として可能か」を表す（听得懂＝聞いて分かる）。能・可以などの助動詞とは別。肯定形は疑問や対比で使い、日常では否定形（听不懂）がよく使われる","“吗”疑問は文末に「吗」。反復疑問は「听得懂听不懂」の形。口語では「听不听得懂」のような短い形も使われる（本アプリは両方を正解にします）","「得」「不」はどちらも軽声（de・bu）。「不」は bù→bú の変調をしない。程度補語の「得」（说得好）とは別。买不起（買う余裕がない）のように「起」を使う補語もある"],"kind":"pot","hsk":{"it":[[209,"3","可能补语1：动词+得/不+动词/形容词"]],"lv":"3"},"ck":{"lv":"3","it":"可能補語","n":""}},{"id":"keneng_dir","name":"方向補語の可能形（回得来・进不去）","notes":["「動詞＋得／不＋方向補語」＝（その方向へ）〜できる／できない：回得来（帰って来られる）・进不去（入って行けない）・站不起来（立ち上がれない）","複合方向補語では「得／不」を動詞の直後に入れる（站起来→站得起来／站不起来）。想得出・想不起来 のように派生用法でも使う","“吗”疑問は文末に「吗」。反復疑問は「回得来回不来」の形。口語の短い形「回不回得来」も正解にします","「得」「不」は軽声（de・bu）。得・不の直後の来・去は声調を付けて読み（回不来 huí bu lái）、複合補語の来・去は軽声（站不起来 zhàn bu qǐlai）"],"kind":"potd","hsk":{"it":[[209,"3","可能补语1：动词+得/不+动词/形容词"]],"lv":"3"},"ck":{"lv":"3","it":"可能補語","n":"方向補語の可能形"}},{"id":"keneng_le","name":"可能補語（得了／不了）","notes":["「動詞＋得了／不了」＝〜しきれる／しきれない（吃不了＝食べきれない）、また状況として〜できる／できない（来不了＝来られない）","この「了」は liǎo と読む。完了・変化の「了」(le) とは別もので、「吃不了了」（もう食べきれなくなった）のように le が後ろに付くこともある","“吗”疑問は文末に「吗」。反復疑問は「来得了来不了」の形。口語の短い形「来不来得了」も正解にします","「不能」は許可・条件・禁止の「できない」、「V不了」は量・体力・都合などで「〜しきれない／〜できない」。日本語の「できない」を何でも「不能」にしない"],"kind":"potl","hsk":{"it":[[296,"4","可能补语2：动词+得/不+了"]],"lv":"4"},"ck":{"lv":"3","it":"可能補語","n":"得了／不了（liǎo）"}},{"id":"shide","name":"“是…的”（強調）","notes":["すでに起きた動作について、「いつ・どうやって・誰と・どこへ」を強調する。「是＋時間／方法＋動詞＋的」。話し言葉では「是」が省略されることもある","否定は「不是…的」（我不是昨天来的）。「不」は「是」の前に置く。「没」は使わない","反復疑問は「是不是…的」（你是不是昨天来的）。“吗”疑問は文末に「吗」。「了」は付けない（✕昨天来了的）","強調したい部分（時間・方法）を動詞の前に置く。目的語が場所のときは「的」の前に置ける（去中国的）。日本語の「〜したのです」に近い"],"kind":"sd","hsk":{"it":[[135,"2","“是……的”句1：强调时间、地点、方式、动作者"]],"lv":"2"},"ck":{"lv":"4","it":"“是…的”構文","n":""}},{"id":"jianyu_rang","name":"兼語文（让：〜させる）","notes":["「主語＋让＋人＋動詞（＋目的語）」＝（人）に…させる。間の「人」が後ろの動詞の主語も兼ねる（兼語）","否定は「不让」＝〜させない。禁止・不許可の意味にもなる（妈妈不让我玩游戏）","反復疑問は「让不让」。“吗”疑問では「我」を「你」に替える（妈妈让你买菜吗）","「让」は「〜するように言う」「〜させてあげる（許可）」にも使う。話し言葉でも書き言葉でも使える"],"kind":"jy","hsk":{"it":[[136,"2","兼语句1：表使令：主语+请/叫/让……+宾语1+动词+宾语2"]],"lv":"2"},"ck":{"lv":"3","it":"兼語文","n":""}},{"id":"jianyu_qing","name":"兼語文（请：〜してもらう）","notes":["「主語＋请＋人＋動詞（＋目的語）」＝（人）に…してもらう・…するよう頼む。間の「人」が後ろの動詞の主語も兼ねる（兼語）","「请＋人＋吃饭／喝咖啡／看电影」＝ごちそうする・招待する（誘った側が費用を持つ）","否定は「不请」。反復疑問は「请不请」。“吗”疑問では「我」を「你」に替える","文頭の「请」（请坐・请喝茶）は「どうぞ〜してください」。この課の「请＋人＋動詞」とは別の使い方"],"kind":"jy","hsk":{"it":[[136,"2","兼语句1：表使令：主语+请/叫/让……+宾语1+动词+宾语2"]],"lv":"2"},"ck":{"lv":"3","it":"兼語文","n":""}},{"id":"jianyu_jiao","name":"兼語文（叫：〜するように言う）","notes":["「主語＋叫＋人＋動詞（＋目的語）」＝（人）に…するように言う・…させる。話し言葉でよく使う","否定は「不叫」。反復疑問は「叫不叫」。“吗”疑問では「我」を「你」に替える","「叫我起床」＝私を起こす、のように「声をかけて〜させる」意味にもなる","「叫」には「（名前は）〜という」（我叫…）や「呼ぶ」の意味もある。兼語文では「让」とほぼ同じように使える"],"kind":"jy","hsk":{"it":[[136,"2","兼语句1：表使令：主语+请/叫/让……+宾语1+动词+宾语2"]],"lv":"2"},"ck":{"lv":"3","it":"兼語文","n":""}},{"id":"cunxian","name":"存現文（場所＋動詞＋着）","notes":["「場所＋動詞＋着＋数量＋人・物」＝〜に…が（…して）いる・ある。場所が主語の位置に来る","人・物は動詞の後ろ（✕一张地图在墙上挂着 ではなく 墙上挂着一张地图）。数量を付けることが多い","否定は「没(有)＋動詞＋着」で数量は付けない。反復疑問は文末に「没有」","使う動詞：挂（掛かる）・放（置く）・站（立つ）・坐（座る）・住（住む）など"],"kind":"cx","hsk":{"it":[[130,"2","存现句2：处所+动词+着(+数量短语)+名词"]],"lv":"2"},"ck":{"lv":"3","it":"存現文","n":""}},{"id":"ba","name":"“把”構文（処置）","notes":["「主語＋把＋目的語＋動詞＋補語など＋了」＝〜を…してしまう（目的語をどう処置したかを表す）","動詞の後ろには結果補語（完・好・干净）・方向補語（来・走）・「在＋場所」などが必要。動詞だけでは言わない（✕我把作业写）","否定は「没(有)」を「把」の前に置く（✕我把作业没写完）。「了」は消える","“吗”疑問は「…了吗」、反復疑問は文末に「没有」"],"kind":"ba","hsk":{"it":[[215,"3","“把”字句1：主语+把+宾语+动词+在/到+处所"],[216,"3","“把”字句1：主语+把+宾语1+动词（+给）+宾语2"],[217,"3","“把”字句1：主语+把+宾语+动词+结果补语/趋向补语/状态补语"]],"lv":"3"},"ck":{"lv":"3","it":"“把”構文","n":""}},{"id":"bei","name":"“被”構文（受身）","notes":["「主語＋被＋行為者＋動詞＋補語など＋了」＝〜に…されてしまった（受身）。困ったこと・望まないことに使うことが多い","動詞の後ろには結果補語（完・走）・「在＋場所」などが必要（✕自行车被朋友借）","否定は「没(有)」を「被」の前に置く（✕被朋友没借走）。「了」は消える","“吗”疑問は「…了吗」、反復疑問は文末に「没有」。行為者は「被人」（誰かに）とぼかすこともできる"],"kind":"bei","hsk":{"it":[[218,"3","被动句1：主语+被+宾语+动词+其他成分"]],"lv":"3"},"ck":{"lv":"3","it":"受動文（“被”構文）","n":""}}],"sents":[{"u":0,"p":2,"n":"①","t":"P","b":-1,"k":"那/nà 个/ge 手机/shǒujī","j":"あの携帯電話"},{"u":0,"p":2,"n":"②","t":"P","b":-1,"k":"他们/tāmen 老师/lǎoshī","j":"彼らの先生"},{"u":0,"p":2,"n":"③","t":"P","b":-1,"k":"这/zhè 个/ge 朋友/péngyou","j":"この友達"},{"u":0,"p":2,"n":"④","t":"P","b":-1,"k":"这/zhè 张/zhāng 照片/zhàopiàn","j":"この写真"},{"u":0,"p":2,"n":"⑤","t":"P","b":-1,"k":"这/zhè 个/ge 孩子/háizi","j":"この子供"},{"u":0,"p":2,"n":"⑥","t":"P","b":-1,"k":"爸爸/bàba 的/de","j":"お父さんの(もの)"},{"u":0,"p":2,"n":"⑦","t":"P","b":-1,"k":"朋友/péngyou 的/de 大学/dàxué","j":"友達の大学"},{"u":0,"p":2,"n":"⑧","t":"P","b":-1,"k":"朋友/péngyou 的/de","j":"友達の(もの)"},{"u":0,"p":2,"n":"⑨","t":"P","b":-1,"k":"你/ function markSyl(s,t){s=s.toLowerCase().replace(/u:|ü/g,'v');
  if(t<1||t>4)return s.replace(/v/g,'ü');

const IV=[10/1440,1,3,7,14,30];
function record(id,ok){const p=PROG[id]||{b:0,ok:0,ng:0};
  if(ok){p.b=Math.min(5,p.b+1);p.ok++}else{p.b=0;p.ng++}
  p.d=Date.now()+IV[p.b]*864e5;PROG[id]=p;LS.set('prog',PROG);
  const k=new Date().toISOString().slice(0,10);const l=LOG[k]||{n:0,ok:0};l.n++;if(ok)l.ok++;LOG[k]=l;LS.set('log',LOG)}
function pick(pool,n){const now=Date.now();
  return pool.map(it=>{const p=PROG[it.id];let s;
    if(!p)s=.5+Math.random();else if(p.d<=now)s=Math.random()*.3-Math.min(2,(now-p.d)/864e5)*.05+p.b*.1;else s=2+Math.random();
    return[s,it]}).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1])}

function findVoice(lang){const L=lang.toLowerCase();
  return voices.find(x=>x.lang&&x.lang.replace('_','-').toLowerCase()===L)||voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(L.slice(0,2)))||null}
function speak(text,lang,rate,onend){lang=lang||'zh-CN';text=String(text==null?'':text).replace(/[＋+＝=＊*＃#＆&＄$％%＠@＾^｜|＼\\\/／＿_＜＞<>→←↑↓↔⇔～〜…※★☆●○◎△▲▽▼■□◆◇♪]/g,' ').replace(/\s+/g,' ').trim();
  if(!('speechSynthesis' in window)){toast('このブラウザは音声合成に対応していません');if(onend)onend();return}

    u.rate=rate||(lang.startsWith('ja')?Math.max(.85,set.rate):set.rate);

function tile(t,attr,used){const g=set.gloss&&GLOSS[t.z]?`<span class="gl">${esc(GLOSS[t.z])}</span>`:'';

const DUM=[T('不','bù'),T('没有','méiyǒu'),T('吗','ma'),T('很','hěn'),T('的','de'),T('了','le')];

function mkVocab(w){const pool=vocabPoolAll().filter(x=>x!==w&&x.ja!==w.ja&&x.z!==w.z);const ds=shuffle(pool).slice(0,3);const m=vmode;
  const lab={zh2ja:'この中国語の意味は？',ja2zh:'中国語にすると？',py2zh:'このピンインに合う漢字は？',zh2py:'このピンインはどれ？'}[m];
  const P=m==='zh2ja'?`<div class="big" lang="zh-Hans" style="font-family:var(--f-zh)">${esc(w.z)}</div>`:m==='ja2zh'?`<div class="big">${esc(w.ja)}</div>`:m==='py2zh'?`<div class="big py">${pyHTML(w.p)}</div>`:`<div class="big" lang="zh-Hans" style="font-family:var(--f-zh)">${esc(w.z)}</div>`;
  const h=x=>m==='zh2ja'?esc(x.ja):m==='zh2py'?`<span class="py" style="font-size:1.2rem">${pyHTML(x.p)}</span>`:`<span class="zhbig" lang="zh-Hans">${esc(x.z)}</span>`;
  let all=[w,...ds];if(m==='zh2py'){const base=w.p;const idx=[...base.matchAll(markRe)].map(x=>x.index);const vs=new Set([base]);let g=0;
    while(vs.size<4&&idx.length&&g++<40){const i=idx[rnd(idx.length)],c=base[i];const key=Object.keys(VOW).find(k=>VOW[k].includes(c));if(!key)break;vs.add(base.slice(0,i)+VOW[key][rnd(4)]+base.slice(i+1))}
    all=[...vs].map(p=>({p,ok:p===base,ja:'',z:''}))}
  const opts=shuffle(all).map(x=>({ok:m==='zh2py'?x.ok:x===w,h:h(x)}));
  return{speak:null,prompt:`<div class="sub">${lab}</div>${P}<button class="say" data-act="say" data-t="${esc(w.z.replace(/[()]/g,''))}">🔊</button>`,opts,picked:null,

  return{speak:null,prompt:`<div class="sub">合う量詞は？</div><div class="big" lang="zh-Hans" style="font-family:var(--f-zh)">这 ＿＿ ${esc(n.z)}</div><div class="sub">${esc(n.ja)}（${esc(n.p)}）</div>`,opts,picked:null,

 mkfile(){const d=JSON.stringify({cj4mk:1,mine:mkAll(),py:MKPY});dl('中国語4段道場_自作.json',new Blob([d],{type:'application/json'}))}
});
mkInject();
(function(){const m=/[#&]mk=([^&]+)/.exec(location.hash||'');if(!m)return;
  try{const n=mkMerge(decodeURIComponent(m[1]));history.replaceState(null,'',location.href.replace(/&?mk=[^&]+/,''));setTimeout(()=>toast(n?n+'文の配布された自作を取り込みました':'この配布リンクの文はすでに取り込み済みです'),400)}
  catch(e){setTimeout(()=>toast('配布リンクを読み込めませんでした'),400)}})();
window.__cj4mk={MKR,mkSeg,mkSlots,mkDerive,mkSlotsOf,mkPy};   /* 検証用 */

const isHid=el=>!el.classList.contains('rev')&&((el.classList.contains('zh')&&set.hz)||(el.classList.contains('py')&&set.hp)||(el.classList.contains('ja')&&set.hj));
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){e.preventDefault();A[a.dataset.act](a);return}
  const h=e.target.closest('[data-hid] .zh,[data-hid] .py,[data-hid] .ja');
  if(h&&isHid(h)){h.classList.add('rev');return}
  const s=e.target.closest('[data-say]');
  if(s){if(s.classList.contains('mdl')&&s.closest('#doc:not(.ans)'))return;speak(s.dataset.say,s.dataset.lang||'zh-CN')}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-set]');if(!el)return;const k=el.dataset.set;
  let val=el.type==='checkbox'?el.checked:el.value;
  if(k==='rate'||k==='count')val=+val;
  if(k==='lmode'){lmode=val;LS.set('lmode',val);return}if(k==='vmode'){vmode=val;return}
  if(k==='zoom'&&val!=='fit')val=+val;
  set[k]=val;
  if(k==='hz'||k==='hp'||k==='hj'){applyUI();clearRev();return}
  saveSet();applyUI();
  if(['a4g','a4v','a4l','ans','zoom'].includes(k)){if(tab==='make')render();else renderDoc();return}
  if(k==='vsort'){render();return}
  if(['cfmt','cq','weakOnly','dummy','ignoreTone','count'].includes(k)){if(!S)render();return}
  if(['showPy','tone','gloss'].includes(k)){if(S)renderMain();else if(tab!=='learn'||true)render()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!S||!S.q)return;const t=e.target;
  if(S.kind==='compose'||S.kind==='lis'){if(S.q.done)nextQ();else if(t.id==='ansIn')A.check()}
  else if(S.q.picked!=null&&t.tagName!=='BUTTON')nextQ()});
window.addEventListener('hashchange',()=>{if(applySpec(readSpec())){S=null;render()}});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if($('#doc'))applyZoom()},150)});

/* ---------- init ---------- */
document.title=APP_NAME;$('#appname').textContent=APP_NAME;
buildAll();
window.__zh={numToMark,normPy,CATS,D,set,state:()=>S,render,A,renderDoc,sortedVoc};
render();
})();
